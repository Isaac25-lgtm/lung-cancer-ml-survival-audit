# Pinned public data sources. Raw bytes are downloaded to data/raw/ (gitignored).
# Each file's SHA-256, size, HTTP status and retrieval time are written to
# data/raw/MANIFEST.json by `python -m src.download_data`.
#
# Redistribution: none of these raw files are committed to git. MMIST-LUNG has no
# licence file in its repository (checked 2026-11-05), so we treat its contents as
# "all rights reserved" for redistribution purposes and only publish aggregates.

